name: DB Schema Check
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: db-schema-check-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  db_schema_check:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: money
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_USER: root
      DB_PASS: root
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: スキーマを master.sql から日付順に適用
        run: |
          set -eu
          sql_dir=backend/datasource/db/src/jvmMain/resources/sql
          for file in "$sql_dir/master.sql" $(ls "$sql_dir"/2*.sql | sort); do
            echo "apply: $file"
            mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u "$DB_USER" -p"$DB_PASS" money < "$file"
          done
      - run: ./gradlew :backend:datasource:db:schema:generateDbCode
      - name: 生成コードに差分が無いことを確認
        run: |
          git add -N .
          git diff --exit-code --stat
