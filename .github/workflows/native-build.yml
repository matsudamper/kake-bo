name: Native Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: native-build-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  native_build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dkotlin.compiler.execution.strategy=in-process -Dorg.gradle.workers.max=2 -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx6g"
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: GraalVM のセットアップ
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          native-image-job-reports: 'true'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: ネイティブイメージをビルド
        run: ./gradlew :backend:nativeCompile

      - name: ネイティブバイナリの healthz スモークテスト
        run: |
          export $(grep -v '^#' schema_update_local.env | xargs)
          export CI=true
          export PORT=8080
          export IS_DEBUG=true
          export HTML_PATH=/tmp/html
          mkdir -p /tmp/html
          echo '<html></html>' > /tmp/html/index.html

          SERVER_LOG=/tmp/backend-native.log
          ./backend/build/native/nativeCompile/backend > "$SERVER_LOG" 2>&1 &
          SERVER_PID=$!

          TIMEOUT=60
          ELAPSED=0
          until curl -sf --max-time 5 http://localhost:${PORT}/healthz > /dev/null 2>&1; do
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "サーバー起動がタイムアウトしました (${TIMEOUT}秒)"
              echo "--- サーバーログ ---"
              cat "$SERVER_LOG" || true
              echo "--- プロセス状態 ---"
              ps -p "$SERVER_PID" 2>/dev/null || echo "プロセスはすでに終了しています"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done

          RESPONSE=$(curl -sf --max-time 5 http://localhost:${PORT}/healthz)
          if [ "$RESPONSE" = "ok" ]; then
            echo "healthzチェック成功"
          else
            echo "healthzチェック失敗: $RESPONSE"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          # スキーマの読み込みとリゾルバの結線は最初の GraphQL リクエストで走る。
          # リフレクション登録やリソース同梱の漏れは JVM では再現しないので、ここで実際に叩く
          GRAPHQL_RESPONSE=$(curl -s --max-time 30 -X POST \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -d '{"query":"query { isAdminLoggedIn }"}' \
            http://localhost:${PORT}/query || true)
          echo "$GRAPHQL_RESPONSE"
          if ! echo "$GRAPHQL_RESPONSE" | grep -q '"isAdminLoggedIn":false'; then
            echo "GraphQLチェック失敗"
            echo "--- サーバーログ ---"
            cat "$SERVER_LOG" || true
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          kill $SERVER_PID 2>/dev/null || true

      - name: ネイティブバイナリのアップロード
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-native-${{ github.sha }}
          path: backend/build/native/nativeCompile/backend
          retention-days: 7
