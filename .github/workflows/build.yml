name: Build And Test
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: build-and-test-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      GRADLE_OPTS: -Dkotlin.compiler.execution.strategy=in-process -Dorg.gradle.workers.max=2 -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx4500m"
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew ktlintCheck --continue
      - run: ./gradlew detekt --continue
      - env:
          CI: true
        run: ./gradlew :frontend:android:app:assembleDebug
      - name: Rename APK with branch and short hash
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          SAFE_REPO="${REPOSITORY##*/}"
          SAFE_BRANCH="${BRANCH_NAME//\//-}"
          APK_NAME="app-${SAFE_REPO}-${SAFE_BRANCH}-${SHORT_SHA}.apk"
          mv frontend/android/app/build/outputs/apk/debug/app-debug.apk \
             "frontend/android/app/build/outputs/apk/debug/${APK_NAME}"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"
          echo "APK_PATH=frontend/android/app/build/outputs/apk/debug/${APK_NAME}" >> "$GITHUB_ENV"
      - id: upload_apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_PATH }}
          compression-level: 9
      - name: Upload APK to S3
        id: upload_s3
        uses: matsudamper/actions/upload-matsudamper-s3@6f7068834e08294360d6e5987869a5f50c924c66 # v1.0.1
        continue-on-error: true
        with:
          file_path: ${{ env.APK_PATH }}
      - name: Upload GitHub QR artifact
        if: github.event_name == 'pull_request'
        id: github_qr_artifact
        uses: matsudamper/actions/upload-qr-code@5c2f397727eaf53708de3f663fa9b754f55d80be # v1.1.1
        with:
          url: ${{ steps.upload_apk.outputs.artifact-url }}
          output_path: qrcode-github.png
          artifact_name: apk-qr-code-github
      - name: Upload S3 QR artifact
        if: github.event_name == 'pull_request' && steps.upload_s3.outputs.url != ''
        id: s3_qr_artifact
        uses: matsudamper/actions/upload-qr-code@5c2f397727eaf53708de3f663fa9b754f55d80be # v1.1.1
        with:
          url: ${{ steps.upload_s3.outputs.url }}
          output_path: qrcode-s3.png
          artifact_name: apk-qr-code-s3
      - name: APKダウンロードURLをコメント
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: apk-download
          recreate: true
          message: |
            ✅ **Debug APK is ready!**

            | Storage | Download Link | QR Code |
            | :--- | :--- | :--- |
            | 🐙 GitHub Artifacts | [Download](${{ steps.upload_apk.outputs.artifact-url }}) | [View](${{ steps.github_qr_artifact.outputs.artifact-url }}) |
            ${{ steps.upload_s3.outputs.url && format('| ☁️ S3 | [Download]({0}) | [View]({1}) |', steps.upload_s3.outputs.url, steps.s3_qr_artifact.outputs.artifact-url) || '' }}

            ---
            *Artifact Name: `${{ env.APK_NAME }}`*
      - run: ./gradlew :backend:assemble
      - name: Backend healthz smoke test
        run: |
          mkdir -p backend-server
          tar -xf backend/build/distributions/backend.tar -C backend-server --strip-components=1
          export $(grep -v '^#' schema_update_local.env | xargs)
          export PORT=8080

          SERVER_LOG=backend-server/server.log
          ./backend-server/bin/backend > "$SERVER_LOG" 2>&1 &
          SERVER_PID=$!
          echo "サーバーを起動しました (PID: ${SERVER_PID}, PORT: ${PORT})"

          TIMEOUT=60
          ELAPSED=0
          until curl -sf --max-time 5 http://localhost:${PORT}/healthz > /dev/null 2>&1; do
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "サーバー起動がタイムアウトしました (${TIMEOUT}秒)"
              echo "--- サーバーログ ---"
              cat "$SERVER_LOG" || true
              echo "--- プロセス状態 ---"
              ps -p "$SERVER_PID" 2>/dev/null || echo "プロセスはすでに終了しています"
              echo "--- ポート使用状況 ---"
              ss -tlnp | grep ":${PORT}" || echo "ポート ${PORT} は使用されていません"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
          done

          RESPONSE=$(curl -sf --max-time 5 http://localhost:${PORT}/healthz)
          if [ "$RESPONSE" = "ok" ]; then
            echo "healthzチェック成功 (${ELAPSED}秒で起動)"
          else
            echo "healthzチェック失敗: $RESPONSE"
            echo "--- サーバーログ ---"
            cat "$SERVER_LOG" || true
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          kill $SERVER_PID 2>/dev/null || true
      - run: ./gradlew :frontend:app:wasmJsBrowserDevelopmentWebpack
      - run: ./gradlew allTests
      - name: collect reports file
        if: failure()
        run: |
          mkdir -p .tmp/reports
          find -wholename "*/build/reports" | xargs -I {} bash -c "mkdir -p .tmp/reports/{} && cp -r {} .tmp/reports/{}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: reports
          path: .tmp/reports/
          retention-days: 7
