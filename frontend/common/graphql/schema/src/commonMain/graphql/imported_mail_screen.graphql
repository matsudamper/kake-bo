query ImportedMailScreen($id: ImportedMailId!) {
    user {
        settings {
            aiConfig {
                defaultMailParsePrompt
            }
        }
        importedMailAttributes {
            mail(id: $id) {
                id
                from
                hasPlain
                hasHtml
                subject
                dateTime
                usages {
                    id
                    amount
                    title
                    description
                    date
                    moneyUsageSubCategory {
                        id
                        name
                        category {
                            id
                            name
                        }
                    }
                }
                suggestUsages {
                    title
                    serviceName
                    description
                    dateTime
                    amount
                    subCategory {
                        id
                        name
                        category {
                            id
                            name
                        }
                    }
                }
            }
        }
    }
}

mutation ImportedMailScreenDeleteMail($id: ImportedMailId!) {
    userMutation {
        deleteImportedMail(id: $id)
    }
}

mutation ImportedMailScreenParseWithAi($id: ImportedMailId!, $prompt: String!, $model: AiMailParseModel!) {
    userMutation {
        parseImportedMailWithAi(id: $id, prompt: $prompt, model: $model) {
            usages {
                title
                description
                amount
                dateTime
            }
            error
            errorMessage
        }
    }
}
