query ImportedMailScreen($id: ImportedMailId!) {
    user {
        importedMailAttributes {
            mail(id: $id) {
                id
                from
                hasPlain
                hasHtml
                subject
                dateTime
                usages {
                    id
                    amount
                    title
                    description
                    date
                    moneyUsageSubCategory {
                        id
                        name
                        category {
                            id
                            name
                        }
                    }
                }
                suggestUsages {
                    ...ImportedMailScreenSuggestUsage
                }
            }
        }
    }
}

mutation ImportedMailScreenDeleteMail($id: ImportedMailId!) {
    userMutation {
        deleteImportedMail(id: $id)
    }
}

mutation ImportedMailScreenParseWithAi($id: ImportedMailId!) {
    userMutation {
        parseImportedMailWithAi(id: $id) {
            usages {
                ...ImportedMailScreenSuggestUsage
            }
            error
            errorMessage
        }
    }
}

fragment ImportedMailScreenSuggestUsage on MoneyUsageSuggest {
    title
    serviceName
    description
    dateTime
    amount
    subCategory {
        id
        name
        category {
            id
            name
        }
    }
}
