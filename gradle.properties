kotlin.code.style=official
org.jetbrains.compose.experimental.jscanvas.enabled=true

org.gradle.caching=true
org.gradle.jvmargs=-XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# :backend:nativeCompile の native-image 生成用（org.gradle.jvmargs は Gradle デーモン専用で別物）
# ホスト JVM の -Xmx で上限を決める（未指定だと搭載 RAM をほぼ使い切り、Gradle と競合しやすい）
# カンマ区切り。GC フラグ（-XX:+UseG1GC 等）は native-image 起動と競合するため付けない
# 上書き: -PnativeImageBuild.jvmArgs=-Xmx8g
nativeImageBuild.jvmArgs=-Xmx12g
# 任意。native-image 内部ヒープの RAM 比率（省略時は GraalVM 既定の 80%）
# nativeImageBuild.maxHeapSizePercent=70
# true で -Ob（ビルドは速いが実行時は -O2 より遅い）。Native Build CI は workflow 側で true
# nativeImageBuild.quickBuild=true

android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
android.newDsl=false
